# Project spec for XcodeGen. Run `xcodegen generate` (or scripts/build.sh)
# to (re)create Stickys.xcodeproj from this file.
name: Stickys

options:
  bundleIdPrefix: app.stickys
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Everything runs on the main thread unless marked otherwise — right for a UI app.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES

targets:
  Stickys:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: Stickys
        CFBundleDisplayName: Stickys
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        # Agent app: no Dock icon, not in ⌘-Tab. Lives in the menu bar instead.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stickys.Stickys
        PRODUCT_NAME: Stickys
        GENERATE_INFOPLIST_FILE: NO
        # Ad-hoc "sign to run locally" — no Apple developer account needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
